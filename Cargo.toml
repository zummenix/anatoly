[package]
name = "anatoly"
version = "0.1.0"
edition = "2024"

[dependencies]
rig = "0.43.0"
schemars = { version = "1.2.1", features = ["preserve_order"] }
serde = "1.0.228"
serde_json = { version = "1.0.150", features = ["preserve_order"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [
    "macros",
    "io-util",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
insta = { version = "1.47.2", features = ["filters"] }
rig = { version = "0.43.0", features = ["test-utils"] }
temp-dir = "0.2.0"
tokio = { version = "1.52.3", features = ["test-util"] }
